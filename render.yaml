services:
  # ── Backend: NestJS API ──
  - type: web
    name: linkpay-api
    env: node
    region: frankfurt
    plan: starter
    rootDir: linkpay-api
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 365d
      - key: ENABLE_SWAGGER
        value: false
      - key: TWO_FACTOR_ENCRYPTION_KEY
        sync: false
      - key: APP_CODE_PEPPER
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ALERT_EMAIL_FROM
        sync: false
      - key: ALERT_EMAILS
        sync: false
      - key: ADMIN_REFRESH_EXPIRES_IN
        value: 12h
      - key: ADMIN_ALLOWED_IPS
        sync: false
      - key: PSP_PROVIDER
        value: cinetpay
      - key: CINETPAY_API_KEY_CD
        sync: false
      - key: CINETPAY_API_PASSWORD_CD
        sync: false
      - key: PROXY_URL
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: FCM_PROJECT_ID
        sync: false
      - key: FCM_CLIENT_EMAIL
        sync: false
      - key: FCM_PRIVATE_KEY
        sync: false

  # ── Frontend: React PWA (static) ──
  - type: web
    name: linkpay-web
    env: static
    region: frankfurt
    plan: starter
    rootDir: linkpay-web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_PUBLIC_WEB_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_VAPID_PUBLIC_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # Render's default is `Cache-Control: public, max-age=0, s-maxage=300`
    # on every file — fine for content-hashed assets (/assets/*), but it lets
    # the Cloudflare edge in front of Render serve a stale sw.js/index.html
    # for up to 5 minutes after each deploy, defeating pwa-update.ts's
    # silent-auto-update flow (it can only detect a new version once it
    # actually receives new bytes). These three files change on every
    # deploy and must never be served from the edge cache.
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache
      # ── Security headers (every response) ──
      # CSP: scripts only from our own origin, so a script injected through a
      # stray bug can't run or phone home; the page can't be framed
      # (clickjacking). connect-src lists the API (Render) and Supabase
      # (REST + realtime websockets) — add a host here if the app starts
      # calling a new one, or the browser will block it.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://*.onrender.com https://*.supabase.co wss://*.supabase.co https://*.googleapis.com; worker-src 'self' blob:; manifest-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self' https:; frame-ancestors 'none'"
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(self), microphone=(), geolocation=(), payment=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
