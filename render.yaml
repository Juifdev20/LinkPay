services:
  # ── Backend: NestJS API ──
  - type: web
    name: linkpay-api
    env: node
    region: frankfurt
    plan: starter
    rootDir: linkpay-api
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 365d
      - key: PSP_PROVIDER
        value: cinetpay
      - key: CINETPAY_API_KEY_CD
        sync: false
      - key: CINETPAY_API_PASSWORD_CD
        sync: false
      - key: PROXY_URL
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false

  # ── Frontend: React PWA (static) ──
  - type: web
    name: linkpay-web
    env: static
    region: frankfurt
    plan: starter
    rootDir: linkpay-web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_VAPID_PUBLIC_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # Render's default is `Cache-Control: public, max-age=0, s-maxage=300`
    # on every file — fine for content-hashed assets (/assets/*), but it lets
    # the Cloudflare edge in front of Render serve a stale sw.js/index.html
    # for up to 5 minutes after each deploy, defeating pwa-update.ts's
    # silent-auto-update flow (it can only detect a new version once it
    # actually receives new bytes). These three files change on every
    # deploy and must never be served from the edge cache.
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache
