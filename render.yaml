services:
  # ── Backend: NestJS API ──
  - type: web
    name: linkpay-api
    env: node
    region: frankfurt
    plan: starter
    rootDir: linkpay-api
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 365d
      - key: ENABLE_SWAGGER
        value: false
      - key: TWO_FACTOR_ENCRYPTION_KEY
        sync: false
      - key: APP_CODE_PEPPER
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ALERT_EMAIL_FROM
        sync: false
      - key: ALERT_EMAILS
        sync: false
      - key: SMS_PROVIDER
        sync: false
      - key: AT_USERNAME
        sync: false
      - key: AT_API_KEY
        sync: false
      - key: AT_SENDER_ID
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      - key: ALERT_SMS_TO
        sync: false
      # Shared rate-limit counters across API instances (the Key Value service below).
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: linkpay-redis
          property: connectionString
      # HttpOnly session cookies for browsers — leave unset until docs/COOKIES_HTTPONLY.md is done.
      - key: COOKIE_AUTH
        sync: false
      - key: COOKIE_SAMESITE
        sync: false
      - key: COOKIE_DOMAIN
        sync: false
      # Android device/app integrity — see docs/ANDROID_INTEGRITY.md (off until configured).
      - key: DEVICE_INTEGRITY_MODE
        value: off
      - key: ANDROID_PACKAGE_NAME
        value: com.scanlinkpay.app
      - key: ANDROID_CERT_SHA256
        sync: false
      - key: PLAY_INTEGRITY_CLIENT_EMAIL
        sync: false
      - key: PLAY_INTEGRITY_PRIVATE_KEY
        sync: false
      - key: INTEGRITY_REQUIRE_PLAY_RECOGNIZED
        sync: false
      - key: INTEGRITY_MAX_AGE_HOURS
        sync: false
      - key: ADMIN_REFRESH_EXPIRES_IN
        value: 12h
      - key: ADMIN_ALLOWED_IPS
        sync: false
      - key: PSP_PROVIDER
        value: flexpaie
      # FlexPaie (docs/FLEXPAIE.md): the address, merchant code and token come from FlexPaie with the account.
      - key: FLEXPAIE_BASE_URL
        sync: false
      - key: FLEXPAIE_MERCHANT
        sync: false
      - key: FLEXPAIE_TOKEN
        sync: false
      - key: CINETPAY_API_KEY_CD
        sync: false
      - key: CINETPAY_API_PASSWORD_CD
        sync: false
      - key: PROXY_URL
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: FCM_PROJECT_ID
        sync: false
      - key: FCM_CLIENT_EMAIL
        sync: false
      - key: FCM_PRIVATE_KEY
        sync: false

  # ── Shared rate-limit counters (Redis-compatible), private to this account's services ──
  - type: keyvalue
    name: linkpay-redis
    region: frankfurt
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: [] # internal network only: nothing outside Render can reach it

  # ── Frontend: React PWA (static) ──
  - type: web
    name: linkpay-web
    env: static
    region: frankfurt
    plan: starter
    rootDir: linkpay-web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_PUBLIC_WEB_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_VAPID_PUBLIC_KEY
        sync: false
      # HttpOnly session cookies (see docs/COOKIES_HTTPONLY.md): set "true" together with VITE_API_URL=/api/v1.
      - key: VITE_AUTH_COOKIES
        sync: false
      # Android app only: Google Cloud project number linked to the app in the Play Console.
      - key: VITE_PLAY_CLOUD_PROJECT_NUMBER
        sync: false
    routes:
      # The browser talks to the API through this site (same origin): that is what lets the session live in
      # HttpOnly SameSite=Strict cookies. Adjust the host if your API service has another URL. Must stay ABOVE /*.
      - type: rewrite
        source: /api/*
        destination: https://linkpayapi.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    # Render's default is `Cache-Control: public, max-age=0, s-maxage=300`
    # on every file — fine for content-hashed assets (/assets/*), but it lets
    # the Cloudflare edge in front of Render serve a stale sw.js/index.html
    # for up to 5 minutes after each deploy, defeating pwa-update.ts's
    # silent-auto-update flow (it can only detect a new version once it
    # actually receives new bytes). These three files change on every
    # deploy and must never be served from the edge cache.
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache
      # API answers (proxied through /api/*) must never be stored by a shared cache: they are per-user and carry cookies.
      - path: /api/*
        name: Cache-Control
        value: no-store, private
      # ── Security headers (every response) ──
      # CSP: scripts only from our own origin, so a script injected through a
      # stray bug can't run; the page can't be framed (clickjacking).
      # connect-src is pinned to the EXACT API host and the EXACT Supabase project (not *.onrender.com /
      # *.supabase.co): a wildcard would let an injected script send the session to any attacker-owned app on
      # those platforms. Change these two hosts here if the API or the Supabase project ever changes, or the
      # browser will block the calls. form-action is 'self' (payments redirect with window.location, not forms).
      # Known gap: img-src still allows any https image (an image request is a way to leak data) — it can be
      # narrowed once every image host the app uses is listed.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://linkpayapi.onrender.com https://lxgdbneabsqrawgcusmv.supabase.co wss://lxgdbneabsqrawgcusmv.supabase.co https://*.googleapis.com; worker-src 'self' blob:; manifest-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(self), microphone=(), geolocation=(), payment=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
