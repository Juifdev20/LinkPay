<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/pwa-192x192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1230f8" />
    <meta name="description" content="ScanLinkPay — Paiements par lien et QR code en RDC" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- No external stylesheet here: a render-blocking request to Google
         Fonts kept the screen white for seconds on slow mobile networks (and
         until timeout offline). Poppins is bundled — see main.tsx. -->
    <title>ScanLinkPay</title>
    <style>
      /* Shown from the very first paint, while the app's JavaScript loads —
         replaced as soon as React renders into #root. */
      html, body { margin: 0; background: #f8fafc; }
      #boot-splash {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 20px;
        background: #f8fafc; font-family: system-ui, -apple-system, sans-serif;
      }
      #boot-splash img { width: 88px; height: 88px; border-radius: 22px; box-shadow: 0 8px 24px rgba(18, 48, 248, 0.18); }
      #boot-splash span {
        width: 28px; height: 28px; border-radius: 50%;
        border: 3px solid rgba(79, 70, 229, 0.2); border-top-color: #4f46e5;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-splash">
        <img src="/pwa-192x192.png" alt="ScanLinkPay" />
        <span></span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
